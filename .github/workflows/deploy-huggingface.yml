name: CI/CD - Test and Deploy Web App

on:
  push:
    branches:
      - main
    paths:
      - "web_app/**"
      - "testing/**"
      - ".github/workflows/**"

jobs:
  test:
    name: Run Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync Testing Environment
        run: uv sync --project testing --frozen

      - name: Run Smoke Test
        working-directory: testing
        env:
          DATABRICKS_URL: ${{ secrets.DATABRICKS_URL }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: uv run python test_end_to_end.py

  deploy:
    name: Deploy to Hugging Face
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone Hugging Face Space
        run: |
          git clone https://huggingface.co/spaces/seth-gallucci27/MAGIC-gamma-telescope huggingface-space
          cd huggingface-space
          git remote set-url origin https://seth-gallucci27:${{ secrets.HUGGINGFACE_TOKEN }}@huggingface.co/spaces/seth-gallucci27/MAGIC-gamma-telescope

      - name: Copy Application Files
        run: |
          rsync -av --delete \
            web_app/Dockerfile \
            web_app/main.py \
            web_app/pyproject.toml \
            web_app/uv.lock \
            huggingface-space/

      - name: Replace README for Hugging Face
        run: |
          cp web_app/README.huggingface.md huggingface-space/README.md

      - name: Commit and Push Changes
        run: |
          cd huggingface-space
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Auto deploy from GitHub" || echo "No changes to commit"
          git push origin HEAD:main

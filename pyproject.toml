[tool.uv.workspace]
members = ["web_app", "mock_data_source", "testing", "training"]

[dependency-groups]
dev = ["basedpyright>=1.40.2", "ruff>=0.17.3"]

[tool.ruff]
target-version = "py313"
extend-exclude = ["web_app", "testing", "databricks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.basedpyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["training/src", "mock_data_source"]
exclude = ["**/.venv"]
typeCheckingMode = "recommended"
